<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>queryMaster – Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>

<body>
<div class="admin-grid">

  <!-- TOP -->
  <div class="top-bar">
    <div>
      Room: <span id="roomState" class="idle">NOT STARTED</span>
    </div>
    <div>
      Question: <span id="qState" class="idle">IDLE</span> |
      Time: <span id="adminTimer">--</span>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- QUESTION LIST -->
    <div class="panel">
      <h3>Questions</h3>
      <div id="qList" class="q-list"></div>
    </div>

    <!-- PREVIEW -->
    <div class="panel">
      <h3>Preview</h3>
      <div class="preview-q" id="previewQ">Select a question</div>
      <div class="preview-opts" id="previewOpts"></div>

      <div style="margin-top:16px;font-size:14px">
        Joined: <span id="joined">0</span> |
        Answered: <span id="answered">0</span> |
        Waiting: <span id="waiting">0</span>
      </div>

      <button id="revealBtn"
              class="secondary"
              disabled
              onclick="reveal()">
        REVEAL ANSWER
      </button>

      <!-- NEW WINNER BUTTON -->
      <button style="margin-top:10px;background:#e67e22;color:#fff"
              onclick="revealWinners()">
        REVEAL TOP 3 WINNERS
      </button>
    </div>

    <!-- ADD QUESTION -->
    <div class="panel">
      <h3>Add Question</h3>

      <input id="q" placeholder="question">
      <input id="o1" placeholder="option 1">
      <input id="o2" placeholder="option 2">
      <input id="o3" placeholder="option 3">
      <input id="o4" placeholder="option 4">
      <input id="c" placeholder="correct index (0-3)">
      <input id="t" placeholder="duration ms (default 30000)">
      <button onclick="addManual()">Add</button>

      <hr>
      <input type="file" id="csvInput" accept=".csv" onchange="handleCSV()">
    </div>

  </div>

  <!-- BOTTOM -->
  <div class="bottom-bar">
    <button onclick="startRoom()">START ROOM</button>
    <button onclick="prevQ()">◀ PREV</button>
    <button onclick="openSelected()">OPEN</button>
    <button onclick="nextQ()">NEXT ▶</button>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script>
if (localStorage.role !== 'admin') location='/';

const socket = io({ query:{ role:'admin' }});

let questions=[], currentIndex=-1;
let joined=0, answered=0;
let endsAt=0, timerInt=null;

/* ROOM */
function startRoom(){
  socket.emit('create_room');
  roomState.innerText='LIVE';
  roomState.className='live';
}

/* QUESTIONS */
function renderList(){
  qList.innerHTML='';
  questions.forEach((q,i)=>{
    const d=document.createElement('div');
    d.className='q-item'+(i===currentIndex?' active':'');
    d.innerText=q.text;
    d.onclick=()=>{currentIndex=i;renderList();preview(q);}
    qList.appendChild(d);
  });
}

function preview(q){
  previewQ.innerText=q.text;
  previewOpts.innerHTML='';
  q.options.forEach((o,i)=>{
    const d=document.createElement('div');
    d.className='preview-opt'+(i===q.correctIndex?' correct':'');
    d.innerText=o;
    previewOpts.appendChild(d);
  });
}

function prevQ(){
  if(currentIndex>0){
    currentIndex--;
    renderList();
    preview(questions[currentIndex]);
  }
}

function nextQ(){
  if(currentIndex<questions.length-1){
    currentIndex++;
    renderList();
    preview(questions[currentIndex]);
  }
}

function openSelected(){
  if(currentIndex<0) return;
  socket.emit('open_question', questions[currentIndex]);
}

/* ADD */
function addManual(){
  if(!q.value||!o1.value||!o2.value||!c.value) return;

  questions.push({
    text:q.value,
    options:[o1.value,o2.value,o3.value,o4.value],
    correctIndex:Number(c.value),
    duration:Number(t.value||30000)
  });

  renderList();
}śśśśśśśśśśśś

function handleCSV(){
  const file=csvInput.files[0];
  if(!file) return;

  const r=new FileReader();
  r.onload=e=>{
    e.target.result.split('\n').forEach(line=>{
      const p=line.split(',').map(x=>x.trim());
      if(p.length>=6){
        questions.push({
          text:p[0],
          options:[p[1],p[2],p[3],p[4]],
          correctIndex:Number(p[5]),
          duration:Number(p[6]||30000)
        });
      }
    });
    renderList();
  };
  r.readAsText(file);
}

/* LIVE STATS */
socket.on('clients', list=>{
  joined=list.length;
  updateStats();
});

socket.on('live_stats', s=>{
  answered=s.total||0;
  updateStats();
});

function updateStats(){
  document.getElementById('joined').innerText=joined;
  document.getElementById('answered').innerText=answered;
  document.getElementById('waiting').innerText=Math.max(0,joined-answered);
}

/* TIMER */
socket.on('question_open', q=>{
  qState.innerText='LIVE';
  qState.className='live';
  revealBtn.disabled=true;
  endsAt=q.endsAt;
  clearInterval(timerInt);

  timerInt=setInterval(()=>{
    const r=Math.max(0,endsAt-Date.now());
    adminTimer.innerText=Math.ceil(r/1000)+'s';
    if(r<=0){
      clearInterval(timerInt);
      qState.innerText='READY TO REVEAL';
      qState.className='warn';
      revealBtn.disabled=false;
    }
  },500);
});

function reveal(){
  socket.emit('reveal');
  qState.innerText='REVEALED';
  revealBtn.disabled=true;
}

/* NEW WINNERS FUNCTION */
function revealWinners(){
  if(!confirm("Reveal Top 3 Winners on Host Screen?")) return;
  socket.emit('reveal_winners');
}
</script>
</body>
</html>
