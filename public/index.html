<!-- login page -->

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>queryMaster</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <div class="box">
    <h1>Welcome to</h1>
    <h1>queryMaster</h1><br>
    <input id="username" placeholder="Enter your username" autocomplete="off">
    <input id="password" type="password" placeholder="Enter your password">
    <button onclick="login()">Login</button>
    <button class="secondary" onclick="goRegister()">New here? Register</button>
    <div id="msg" class="msg"></div>
  </div>

<script>
  function goRegister() { window.location.href = '/register.html'; }

  async function login() {
    const msg = document.getElementById('msg');
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value.trim();

    msg.innerText = '';
    if (!u || !p) { msg.innerText = 'username and password required'; return; }

    // send login request for everyone (users, host, admin)
    try {
      const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p })
      });
      const data = await res.json();

      if (!res.ok) { msg.innerText = data.error || 'login failed'; return; }

      // store credentials
      localStorage.username = data.username;
      localStorage.role = data.role; // store the db-provided role

      // redirect based on role
      if (data.role === 'admin') {
        window.location.href = '/admin.html';
      } else if (data.role === 'host') {
        window.location.href = '/host.html';
      } else {
        window.location.href = '/home.html';
      }
    } catch {
      msg.innerText = 'server unreachable';
    }
  }

</script>
</body>
</html>
