<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>play</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/css/main.css">

  <style>
    /* UID Badge */
    .uid-badge {
      position: fixed;
      top: 15px;
      right: 20px;
      background: #222;
      color: #fff;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 2px;
      border: 1px solid #444;
      z-index: 999;
    }

    .time-bar.danger {
      background: #e74c3c !important;
    }

    .flash {
      animation: flashBg 0.5s ease-in-out 3;
    }

    @keyframes flashBg {
      0% { background:#111; }
      50% { background:#300; }
      100% { background:#111; }
    }
  </style>
</head>
<body>

<!-- UID DISPLAY -->
<div class="uid-badge">
  ID: <span id="uidText">----</span>
</div>

<div class="box quiz" id="quizBox">
  <h2 id="q">waiting for question</h2>

  <div class="time-bar-wrap">
    <div class="time-bar" id="timeBar"></div>
  </div>

  <div class="timer" id="timerText">--</div>

  <ul class="list" id="opts"></ul>

  <button id="lockBtn" class="lock-btn" disabled>lock answer</button>

  <div id="stats" class="stats"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
if (localStorage.role !== 'user') location = '/';

const socket = io({ query: { username: localStorage.username } });

const uidText = document.getElementById('uidText');
const qEl = document.getElementById('q');
const optsEl = document.getElementById('opts');
const statsEl = document.getElementById('stats');
const timerText = document.getElementById('timerText');
const timeBar = document.getElementById('timeBar');
const lockBtn = document.getElementById('lockBtn');
const quizBox = document.getElementById('quizBox');

let selectedIndex = null;
let locked = false;
let timerInterval = null;

/* UID RECEIVE */

socket.on('your_code', code => {
  uidText.innerText = code;
  localStorage.playerCode = code;
});

// restore if page refresh
if (localStorage.playerCode) {
  uidText.innerText = localStorage.playerCode;
}

/* SOUND SYSTEM */

const lockSound = new Audio('https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg');
const correctSound = new Audio('https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg');
const wrongSound = new Audio('https://actions.google.com/sounds/v1/cartoon/cartoon_boing.ogg');
const timeUpSound = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');

/* QUESTION OPEN */

socket.on('question_open', q => {

  selectedIndex = null;
  locked = false;
  statsEl.innerText = '';
  qEl.innerText = q.text;
  optsEl.innerHTML = '';
  lockBtn.disabled = true;
  lockBtn.innerText = 'lock answer';

  clearInterval(timerInterval);
  startTimer(q.endsAt);

  q.options.forEach((opt, i) => {
    const li = document.createElement('li');
    li.innerText = opt;
    li.onclick = () => selectOption(i);
    optsEl.appendChild(li);
  });
});

/* SELECT OPTION */

function selectOption(i) {
  if (locked) return;

  selectedIndex = i;
  lockBtn.disabled = false;

  [...optsEl.children].forEach((li, idx) => {
    li.classList.toggle('selected', idx === i);
  });
}

/* LOCK ANSWER */

lockBtn.onclick = () => {
  if (locked || selectedIndex === null) return;

  locked = true;
  lockBtn.disabled = true;
  lockBtn.innerText = 'answer locked, waiting...';

  lockSound.play();
  freezeTimer();
  disableOptions();

  socket.emit('submit', selectedIndex);
};

/* TIMER */

function startTimer(end) {

  const totalDuration = end - Date.now();

  timeBar.style.transition = 'none';
  timeBar.style.width = '100%';
  timeBar.classList.remove('danger');
  void timeBar.offsetWidth;

  timeBar.style.transition = `width ${totalDuration}ms linear`;
  timeBar.style.width = '0%';

  function tick() {
    const remaining = Math.max(0, end - Date.now());
    timerText.innerText = Math.ceil(remaining / 1000) + 's';

    if (remaining <= 5000) {
      timeBar.classList.add('danger');
    }

    if (remaining <= 0) {
      clearInterval(timerInterval);
      timerText.innerText = 'time up';
      lockBtn.disabled = true;

      timeUpSound.play();
      disableOptions();
      flashEffect();
    }
  }

  tick();
  timerInterval = setInterval(tick, 200);
}

function freezeTimer() {
  clearInterval(timerInterval);
  timeBar.style.transition = 'none';
}

function disableOptions() {
  [...optsEl.children].forEach(li => {
    li.style.pointerEvents = 'none';
    li.style.opacity = '0.6';
  });
}

function flashEffect() {
  quizBox.classList.add('flash');
  setTimeout(() => quizBox.classList.remove('flash'), 1500);
}

/* SERVER EVENTS */

socket.on('submission_closed', () => {
  if (!locked) {
    timerText.innerText = 'time up';
    lockBtn.disabled = true;
    disableOptions();
    flashEffect();
  }
});

/* REVEAL */

socket.on('reveal', r => {

  const correct = r.correctIndex;

  [...optsEl.children].forEach((li, idx) => {
    li.classList.remove('selected', 'locked');

    if (idx === correct) {
      li.classList.add('correct');
    } 
    else if (idx === selectedIndex) {
      li.classList.add('wrong');
    } 
    else {
      li.classList.add('dim');
    }
  });

  if (selectedIndex === correct) {
    correctSound.play();
  } else {
    wrongSound.play();
  }

  statsEl.innerText = 'answer revealed';
});
</script>
</body>
</html>
