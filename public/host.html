<!-- host screen (TV / projector display) -->

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>queryMaster – Live Screen</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/host.css">

</head>

<body class="host-screen">

  <!-- MAIN QUESTION AREA -->
  <div class="host-main">
    <div class="host-meta" id="meta">waiting for question</div>
    <div class="host-question" id="question">—</div>

    <!-- timer -->
    <div class="time-bar-wrap">
      <div class="time-bar" id="timeBar"></div>
    </div>
    <div class="timer-text" id="timerText">--</div>

    <!-- options -->
    <div class="options" id="options"></div>
  </div>

  <!-- LEADERBOARD -->
  <div class="leaderboard">
    <h2>Leaderboard</h2>
    <div class="lb-list" id="lbList"></div>
  </div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

const metaEl = document.getElementById('meta');
const qEl = document.getElementById('question');
const optionsEl = document.getElementById('options');
const timerText = document.getElementById('timerText');
const timeBar = document.getElementById('timeBar');
const lbList = document.getElementById('lbList');

let timerInterval = null;

/* QUESTION OPEN */
socket.on('question_open', q => {
  metaEl.innerText = `Question ${q.index + 1}`;
  qEl.innerText = q.text;
  optionsEl.innerHTML = '';
  clearInterval(timerInterval);

  // timer
  startTimer(q.endsAt);

  // options
  q.options.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.id = 'opt-' + i;
    div.innerText = opt;
    optionsEl.appendChild(div);
  });
});

/* TIMER */
function startTimer(end) {
  function tick() {
    const remaining = Math.max(0, end - Date.now());
    timerText.innerText = Math.ceil(remaining / 1000) + 's';
    if (remaining <= 0) clearInterval(timerInterval);
  }

  tick();
  timerInterval = setInterval(tick, 500);

  const total = end - Date.now();
  timeBar.style.transition = 'none';
  timeBar.style.width = '100%';

  setTimeout(() => {
    timeBar.style.transition = `width ${total}ms linear`;
    timeBar.style.width = '0%';
  }, 50);
}

/* REVEAL */
socket.on('reveal', r => {
  // clear all
  document.querySelectorAll('.option').forEach(el=>{
    el.classList.remove('correct','dim');
  });

  // highlight correct
  const correct = document.getElementById('opt-'+r.correctIndex);
  if(correct) correct.classList.add('correct');

  // dim others
  document.querySelectorAll('.option').forEach(el=>{
    if(el!==correct) el.classList.add('dim');
  });

  // leaderboard
  lbList.innerHTML='';
  (r.leaderboard||[])
    .sort((a,b)=>b.score-a.score)
    .forEach(p=>{
      const row=document.createElement('div');
      row.className='lb-item';
      row.innerHTML=`<span>${p.username}</span><span class="lb-score">${p.score}</span>`;
      lbList.appendChild(row);
    });
});


</script>
</body>
</html>
