<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>queryMaster – live screen</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/host.css">

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

</head>

<body class="host-screen">

  <!-- WINNER OVERLAY -->
  <div class="winner-overlay" id="winnerOverlay">
    <div class="winner-title">🏆 champions 🏆</div>
    <div class="podium" id="podium"></div>
  </div>

  <!-- MAIN QUESTION AREA -->
  <div class="host-main">
    <div class="host-meta" id="meta">waiting for question</div>
    <div class="host-question" id="question">—</div>

    <div class="time-bar-wrap">
      <div class="time-bar" id="timeBar"></div>
    </div>
    <div class="timer-text" id="timerText">--</div>

    <div class="options" id="options"></div>
  </div>

  <!-- LEADERBOARD -->
  <div class="leaderboard">
    <h2>leaderboard</h2>
    <div class="lb-list" id="lbList"></div>
  </div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

const metaEl = document.getElementById('meta');
const qEl = document.getElementById('question');
const optionsEl = document.getElementById('options');
const timerText = document.getElementById('timerText');
const timeBar = document.getElementById('timeBar');
const lbList = document.getElementById('lbList');
const winnerOverlay = document.getElementById('winnerOverlay');
const podium = document.getElementById('podium');

let timerInterval = null;

/* QUESTION OPEN */
socket.on('question_open', q => {

  winnerOverlay.style.display = 'none';

  metaEl.innerText = `live question`;
  qEl.innerText = q.text;
  optionsEl.innerHTML = '';
  clearInterval(timerInterval);

  startTimer(q.endsAt);

  q.options.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.id = 'opt-' + i;
    div.innerText = opt;
    optionsEl.appendChild(div);
  });
});

/* TIMER */
function startTimer(end) {
  clearInterval(timerInterval);

  const total = end - Date.now();

  timeBar.style.transition = 'none';
  timeBar.style.width = '100%';
  void timeBar.offsetWidth;

  timeBar.style.transition = `width ${total}ms linear`;
  timeBar.style.width = '0%';

  function tick() {
    const remaining = Math.max(0, end - Date.now());
    timerText.innerText = Math.ceil(remaining / 1000) + 's';

    if (remaining <= 0) clearInterval(timerInterval);
  }

  tick();
  timerInterval = setInterval(tick, 300);
}

/* REVEAL ANSWER */
socket.on('reveal', r => {

  document.querySelectorAll('.option').forEach(el=>{
    el.classList.remove('correct','dim');
  });

  const correct = document.getElementById('opt-'+r.correctIndex);
  if(correct) correct.classList.add('correct');

  document.querySelectorAll('.option').forEach(el=>{
    if(el!==correct) el.classList.add('dim');
  });

  // Update leaderboard with username + code
  lbList.innerHTML='';

  (r.leaderboard || [])
    .sort((a,b)=>b.score-a.score)
    .forEach((p,i)=>{
      const row=document.createElement('div');
      row.className='lb-item';
      row.innerHTML=`
        <span>${i+1}. ${p.username} (${p.code})</span>
        <span class="lb-score">${p.score}</span>
      `;
      lbList.appendChild(row);
    });
});

/* TOP 3 WINNER DISPLAY */
socket.on('show_winners', top3 => {
  
  podium.innerHTML='';
  winnerOverlay.style.display='flex';

  // map out styles and icons for each rank
  const ranks = [
    { class: 'first', medal: '🏆' },
    { class: 'second', medal: '🥈' },
    { class: 'third', medal: '🥉' }
  ];

  top3.forEach((p,i)=>{
    const rank = ranks[i];
    if(!rank) return;

    const div=document.createElement('div');
    div.className=`podium-item ${rank.class}`;
    
    // we use inline visibility trick here to hide elements before animation finishes
    div.innerHTML=`
      <div class="medal">${rank.medal}</div>
      <h3>${p.username}</h3>
      <p>id: ${p.code}</p>
      <div class="score-badge">${p.score} pts</div>
    `;
    podium.appendChild(div);
  });

  // launch confetti celebration
  fireConfetti();
});

/* confetti logic */
function fireConfetti() {
  const duration = 6 * 1000;
  const animationEnd = Date.now() + duration;
  const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 1000 };

  function randomInRange(min, max) {
    return Math.random() * (max - min) + min;
  }

  const interval = setInterval(function() {
    const timeLeft = animationEnd - Date.now();

    if (timeLeft <= 0) {
      return clearInterval(interval);
    }

    const particleCount = 50 * (timeLeft / duration);
    // fire from left and right edges
    confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
    confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
  }, 250);
}
</script>
</body>
</html>
