<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>host</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    body { flex-direction: row; gap: 20px; }
    .box { width: 400px; }
    .leaderboard { width: 300px; height: 400px; overflow-y: auto; }
    .lb-item { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #333; }
    .lb-score { font-weight: bold; color: #4da3ff; }
  </style>
</head>
<body>
  
  <div class="box">
    <h2 id="q">live</h2>
    <div class="timer" id="timer"></div>
    <ul class="list" id="opts"></ul>
    <div id="stats" class="center"></div>
  </div>

  <div class="box leaderboard">
    <h2>Leaderboard</h2>
    <div id="lbList"></div>
  </div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const qEl = document.getElementById('q');
const optsEl = document.getElementById('opts');
const statsEl = document.getElementById('stats');
const timerEl = document.getElementById('timer');
const lbList = document.getElementById('lbList');

socket.on('question_open', q => {
  qEl.innerText = q.text;
  optsEl.innerHTML = '';
  statsEl.innerText = '';
  
  setInterval(() => {
    timerEl.innerText = Math.max(0, Math.ceil((q.endsAt - Date.now())/1000)) + 's';
  }, 500);

  q.options.forEach((o,i) => {
    const li = document.createElement('li');
    li.innerText = o;
    li.id = 'opt-' + i;
    optsEl.appendChild(li);
  });
});

socket.on('live_stats', s => statsEl.innerText = JSON.stringify(s));

socket.on('reveal', r => {
  //highlight correct answer on host screen too
  const correctLi = document.getElementById('opt-' + r.correctIndex);
  if(correctLi) correctLi.classList.add('correct');

  //update leaderboard
  lbList.innerHTML = '';
  r.leaderboard.forEach(p => {
    const div = document.createElement('div');
    div.className = 'lb-item';
    div.innerHTML = `<span>${p.username}</span><span class="lb-score">${p.score}</span>`;
    lbList.appendChild(div);
  });
});
</script>
</body>
</html>
